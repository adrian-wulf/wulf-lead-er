[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wulf-web-leader"
version = "0.1.0"
description = "Lokalny skaner leadów dla web designerów: znajdź małe firmy w Polsce i Niemczech, które potrzebują strony www."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "wulf-web-leader contributors" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
wulf = "wulf_web_leader.cli:app"
brakstrony = "wulf_web_leader.cli:app"
keinweb = "wulf_web_leader.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wulf_web_leader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
