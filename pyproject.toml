[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brakstrony"
version = "0.1.0"
description = "Robin Hood for local web designers: find small businesses in Poland and Germany that need a website."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "brakstrony contributors" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
brakstrony = "brakstrony.cli:app"
keinweb = "brakstrony.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brakstrony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
